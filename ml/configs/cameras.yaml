cameras:
  - id: cam-01
    source: data/demo1.mp4
    process_fps: 8
    realtime: true    # файл в реальном темпе (демо); false — без ожидания (бенчмарк)
    loop: true
    rules:
      zone_intrusion:
        zones: [zone-1]           # id из configs/zones.json (рисуются scripts/draw_zone.py)
        min_inside_s: 0.5         # сколько секунд подряд внутри, чтобы засчитать вход
        min_outside_s: 1.0        # сколько снаружи, чтобы следующий вход дал новое событие
        spawn_inside_counts: true # появился сразу внутри — тоже вход
      fall:                       # на толпе проверяем, что ложных падений нет
        still_s: 3.0              # сколько секунд лежит неподвижно после падения
      fight:                      # на толпе проверяем, что ложных драк нет
        scorer: heuristic         # потом: skeleton / video_model (Фаза 3.2) — меняется только эта строка
        window_s: 2.0             # окно, за которое считается score
        suspect_thr: 0.5          # score >= — событие suspicion
        confirm_thr: 0.7          # score >= ...
        confirm_s: 1.0            # ... столько секунд подряд — событие confirmation (тот же episode_id)
        end_s: 3.0                # спокойно дольше — эпизод закрыт
        close_k: 1.0              # «рядом» = рамки пересекаются или центры ближе роста
        scorer_params:
          arm_speed: 1.5          # скорость рук (ростов/с), которая считается резкой
          turn_speed: 0.8         # или средняя скорость ...
          turn_deg: 90            # ... с разворотом направления (замах -> удар)
      fire: {}                    # без весов выключится — проверка статуса узла
      # --- шаг 11, пакет A (типы 1.1: пока не согласованы с BE — только в лог) ---
      line_crossing:
        lines: [line-walk-1]      # id линий из configs/zones.json ("lines")
        direction: any            # any | in (слева направо вдоль p1->p2) | out
        min_side_s: 0.5           # столько секунд на новой стороне, чтобы засчитать (антидребезг)
        band: 0.03                # полоса у линии (доля кадра), в которой сторона не меняется
      loitering:
        zones: [zone-1]
        dwell_s: 8                # демо; в жизни 60–180 с
        gap_s: 3                  # короткие выходы за границу не обнуляют время
      crowding:
        zones: [zone-hall]
        min_count: 8              # своё для каждой камеры
        min_s: 3                  # столько секунд держится скопление
        clear_s: 10               # людей меньше порога столько — следующее скопление снова событие
      running:
        speed: 1.6                # ростов/с; шаг ~0.7–1.0, бег 1.5–3 (ролик ускорен — проверим ложные)
        min_s: 1.0
      lying_motionless:
        lie_s: 30                 # лежит неподвижно столько секунд
      camera_tampering:           # закрыли / развернули / расфокус / засветка — по самой картинке
        hold_s: 3
  - id: cam-tamper
    source: data/tamper_test.mp4  # demo2 со вставками: закрыли, расфокус, засветка, разворот (scripts/make_tamper_clip.py)
    process_fps: 8
    realtime: true
    rules:
      camera_tampering: {}
  - id: cam-fire
    source: data/fire1.mp4        # D-Fire Videos/VP1 (с огнём)
    process_fps: 8
    realtime: true
    rules:
      fire:
        window_runs: 5            # смотрим последние N прогонов модели огня
        min_hits: 4               # ... пламя должно быть хотя бы в M из них в одном месте
        clear_s: 10               # огня нет столько секунд — следующий очаг даст новое событие
        classes: [fire]           # добавить smoke, если нужно реагировать на дым
        min_conf: 0.25
        flicker: false            # фильтр бликов (лампы, экраны) — включать по результатам тестов
        flicker_min: 0.05
  - id: cam-nofire
    source: data/nofire1.mp4      # D-Fire Videos/FP1: без огня, но похоже — ложных событий быть не должно
    process_fps: 8
    realtime: true
    loop: true
    rules:
      fire: {}
  - id: cam-fight
    source: data/fight1.mp4       # ролик с дракой — положить в data/
    process_fps: 8
    realtime: true
    rules:
      fight: {}
  - id: cam-fall
    source: data/fall1_rgb.avi    # UR Fall fall-01, правая (RGB) половина + 4 с последнего кадра
    process_fps: 8
    realtime: true
    rules:
      fall:
        fall_window_s: 1.0        # за сколько секунд должен произойти переход в горизонталь
        drop_ratio: 0.3           # насколько (в долях роста) опустились бёдра
        torso_angle_deg: 60       # наклон торса от вертикали, чтобы считать позу горизонтальной
        aspect_ratio: 1.0         # или рамка шире, чем выше
        still_s: 3.0              # сколько секунд неподвижно лежит
        still_motion: 0.05        # «неподвижно» = точки смещаются меньше 5% роста за кадр
        get_up_s: 0.5             # сколько вертикально, чтобы считать, что встал
        kpt_conf: 0.5             # точки с меньшей уверенностью не учитываются
  - id: cam-rtsp
    source: rtsp://localhost:8554/cam1   # локальный MediaMTX; для реальной камеры — ${CAM01_USER}:${CAM01_PASS} из .env
    process_fps: 8
    rules: {}
