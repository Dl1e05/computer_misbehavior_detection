[project]
name = "computer_misbehavior_detection_backend"
version = "0.1.0"
description = "Backend for computer misbehavior detection application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.5.1,<2.6",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.162.0",
    "pgvector>=0.5.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.6",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
    "testcontainers[postgres]>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
  "E",     # Style errors
  "F",     # Pyflakes: potential errors
  "I",     # Import sorting
  "B",     # Bugbear: common errors
  "UP",    # Modern Python syntax
  "ASYNC", # Asynchronous code checks
  "S",     # Security checks (flake8-bandit)
]

[tool.ruff.lint.per-file-ignores]
# S101: pytest uses assert. S105/S106: tests use fake passwords on purpose.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
# Name modules by path (e.g. tests.services.test_ingest): test directories
# have no __init__.py, so files with the same name in two of them would
# otherwise clash. "src" keeps app importable as "app".
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]
