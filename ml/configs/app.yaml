# Общие настройки узла. Пороги по камерам и правила — в cameras.yaml.

detector:                  # стадия Inference: ОДНА модель на GPU, батч со всех камер
  weights: weights/yolo26n.pt
  imgsz: 640
  conf: 0.1                # низкий: слабые рамки нужны ByteTrack для второго этапа сопоставления
  device: 0                # 0 — первая GPU, "cpu" — без видеокарты
  half: true               # FP16 на GPU

pose:                      # только для камер, где правилу нужны poses (fall, fight)
  mode: separate           # план А: отдельная pose-модель поверх треков детектора; план Б (pose вместо детектора) — позже
  weights: weights/yolo26n-pose.pt
  imgsz: 640
  conf: 0.25
  device: 0
  half: true
  match_iou: 0.5           # скелет привязывается к треку, если IoU рамок не меньше

tracker:                   # стадия Analytics: свой трекер на КАЖДУЮ камеру
  type: bytetrack          # план Б: botsort (пока не подключён)
  track_thresh: 0.5        # уверенность, с которой рамка может начать новый трек
  min_conf: 0.1            # ниже — рамка выбрасывается совсем
  min_hits: 3              # сколько кадров подряд нужно, чтобы трек считался настоящим
  lost_s: 2.0              # сколько СЕКУНД помнить потерянный трек (в кадры пересчитывается по process_fps)
