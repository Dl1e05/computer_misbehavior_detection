listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
# Write stored messages to disk every 60 s, not every 30 minutes (the
# default): a broker crash loses at most the last minute of queued events.
autosave_interval 60

# SRS §7.1: 256 KB per event, plus room for the topic and MQTT headers. A
# larger message is refused and its publisher disconnected.
max_packet_size 263168

# Messages kept for an offline persistent session (the event worker while it
# is down). The default of 1000 would drop events after a short outage. The
# queue is held in memory, so it is capped in bytes too (512 MB): a long
# outage drops the newest messages instead of crashing the broker, which
# would lose all of them.
max_queued_messages 100000
max_queued_bytes 536870912
