# Общие настройки узла. Пороги по камерам и правила — в cameras.yaml.

detector:                  # стадия Inference: ОДНА модель на GPU, батч со всех камер
  weights: weights/yolo26n.pt
  imgsz: 640
  conf: 0.1                # низкий: слабые рамки нужны ByteTrack для второго этапа сопоставления
  device: 0                # 0 — первая GPU, "cpu" — без видеокарты
  half: true               # FP16 на GPU

pose:                      # только для камер, где правилу нужны poses (fall, fight)
  mode: separate           # план А: отдельная pose-модель поверх треков детектора; план Б (pose вместо детектора) — позже
  weights: weights/yolo26n-pose.pt
  imgsz: 640
  conf: 0.25
  device: 0
  half: true
  match_iou: 0.5           # скелет привязывается к треку, если IoU рамок не меньше

fire:                      # только для камер с правилом fire; веса — после обучения на D-Fire (Фаза 3.1)
  weights: weights/fire_yolo26n.pt   # нет файла — правило fire выключено, это видно в статусе узла
  run_hz: 3                # сколько раз в секунду гонять модель огня на камеру (2–5 хватает)
  imgsz: 640
  conf: 0.25
  device: 0
  half: true

tracker:                   # стадия Analytics: свой трекер на КАЖДУЮ камеру
  type: bytetrack          # план Б: botsort (пока не подключён)
  track_thresh: 0.5        # уверенность, с которой рамка может начать новый трек
  min_conf: 0.1            # ниже — рамка выбрасывается совсем
  min_hits: 3              # сколько кадров подряд нужно, чтобы трек считался настоящим
  lost_s: 2.0              # сколько СЕКУНД помнить потерянный трек (в кадры пересчитывается по process_fps)

face:                      # шаг 7: только участники ПОДТВЕРЖДЁННЫХ событий (список событий — в коде, не здесь)
  model: buffalo_l         # InsightFace: детектор лиц + ArcFace w600k_r50 (веса — только некоммерческое использование)
  model_version: insightface-buffalo_l-1.0   # поднять суффикс при смене модели/выравнивания; BE не сравнивает разные версии
  device: 0
  det_size: 320            # кропы маленькие
  enroll_det_size: 640     # для целых фото в enroll_faces.py
  buffer_s: 5              # сколько секунд кропов держать в памяти до события
  every_n: 3               # каждый N-й кадр трека в буфер
  upper_frac: 0.5          # верхняя доля рамки человека (голова)
  after_s: 2               # сколько секунд дособирать кропы после события
  max_crops: 16            # больше — равномерно прореживаем (скорость)
  min_quality: 0.4         # ниже — no_usable_face
  quality:                 # стартовые пороги — настраивать (Фаза 3.5)
    min_det_score: 0.6
    min_side_px: 48
  storage: data/snapshots  # локальная папка вместо MinIO; ключ faces/<camera>/<дата>/<event_id>_<track>.jpg

node:                      # шаг 8: этот узел ML
  node_id: ml-node-1       # в топике heartbeat; при нескольких узлах — у каждого свой

mqtt:                      # контракт ML -> BE; брокер в разработке — локальный Mosquitto 2
  enabled: true            # false или --no-mqtt — только лог
  host: localhost
  port: 1883               # 8883 + tls: true — в production
  tls: false
  user_env: MQTT_USER      # логин/пароль — из .env (не в git), в разработке можно без них
  password_env: MQTT_PASS
  keepalive_s: 10          # брокер считает клиента пропавшим через ~1.5 × keepalive -> Last Will
  heartbeat_s: 5
  outbox: data/outbox.sqlite
  send_proposed: false     # типы событий, ещё не согласованные с BE (schema 1.1), — только в лог

versions:                  # model_version события = ml + модели, которые участвовали (до 128 символов)
  ml: 0.1.0
  detector: yolo26n-det-1.0.0
  pose: yolo26n-pose-1.0.0
  tracker: bytetrack-1.0
  fire: fire-yolo26n-0.0.0 # своих весов ещё нет (M1)
  rules:
    zone_intrusion: zone-0.1.0
    fall: fall-rule-0.1.0
    fight: fight-heur-0.1.0
    fire: fire-mofn-0.1.0
    line_crossing: line-0.1.0
    loitering: loiter-0.1.0
    crowding: crowd-0.1.0
    running: run-0.1.0
    lying_motionless: lying-0.1.0
    camera_tampering: tamper-0.1.0
